<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>
  <rect x="180" y="20" width="440" height="400" rx="10" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="400" y="45" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Sistema POS e Inventario - La Esquina</text>

  <!-- Actor Cajero -->
  <g>
    <circle cx="60" cy="140" r="12" fill="none" stroke="#222222" stroke-width="1.5"/>
    <line x1="60" y1="152" x2="60" y2="190" stroke="#222222" stroke-width="1.5"/>
    <line x1="35" y1="165" x2="85" y2="165" stroke="#222222" stroke-width="1.5"/>
    <line x1="60" y1="190" x2="40" y2="220" stroke="#222222" stroke-width="1.5"/>
    <line x1="60" y1="190" x2="80" y2="220" stroke="#222222" stroke-width="1.5"/>
    <text x="60" y="238" font-size="12" text-anchor="middle" fill="#222222">Cajero</text>
  </g>

  <!-- Actor Administrador -->
  <g>
    <circle cx="60" cy="320" r="12" fill="none" stroke="#222222" stroke-width="1.5"/>
    <line x1="60" y1="332" x2="60" y2="370" stroke="#222222" stroke-width="1.5"/>
    <line x1="35" y1="345" x2="85" y2="345" stroke="#222222" stroke-width="1.5"/>
    <line x1="60" y1="370" x2="40" y2="400" stroke="#222222" stroke-width="1.5"/>
    <line x1="60" y1="370" x2="80" y2="400" stroke="#222222" stroke-width="1.5"/>
    <text x="60" y="418" font-size="12" text-anchor="middle" fill="#222222">Administrador</text>
  </g>

  <!-- Use cases -->
  <ellipse cx="330" cy="80" rx="95" ry="26" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="330" y="85" font-size="12" text-anchor="middle" fill="#1a365d">Registrar venta</text>

  <ellipse cx="330" cy="150" rx="105" ry="26" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="330" y="155" font-size="12" text-anchor="middle" fill="#1a365d">Emitir tiquete de venta</text>

  <ellipse cx="330" cy="220" rx="100" ry="26" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="330" y="225" font-size="12" text-anchor="middle" fill="#1a365d">Gestionar fiados</text>

  <ellipse cx="330" cy="290" rx="100" ry="26" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="330" y="295" font-size="12" text-anchor="middle" fill="#1a365d">Gestionar productos</text>

  <ellipse cx="330" cy="360" rx="105" ry="26" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="330" y="365" font-size="12" text-anchor="middle" fill="#1a365d">Realizar corte de caja</text>

  <ellipse cx="550" cy="325" rx="100" ry="26" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="550" y="330" font-size="12" text-anchor="middle" fill="#1a365d">Gestionar usuarios</text>

  <!-- Cajero connections -->
  <line x1="95" y1="145" x2="235" y2="85" stroke="#555555" stroke-width="1.2"/>
  <line x1="95" y1="150" x2="225" y2="150" stroke="#555555" stroke-width="1.2"/>
  <line x1="95" y1="160" x2="230" y2="215" stroke="#555555" stroke-width="1.2"/>

  <!-- Administrador connections -->
  <line x1="95" y1="315" x2="230" y2="292" stroke="#555555" stroke-width="1.2"/>
  <line x1="95" y1="325" x2="235" y2="358" stroke="#555555" stroke-width="1.2"/>
  <line x1="95" y1="330" x2="450" y2="325" stroke="#555555" stroke-width="1.2"/>
  <line x1="95" y1="320" x2="230" y2="222" stroke="#555555" stroke-width="1.2"/>

  <!-- include relation -->
  <line x1="330" y1="106" x2="330" y2="124" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="345" y="118" font-size="10" fill="#888888">&lt;&lt;include&gt;&gt;</text>
</svg>
