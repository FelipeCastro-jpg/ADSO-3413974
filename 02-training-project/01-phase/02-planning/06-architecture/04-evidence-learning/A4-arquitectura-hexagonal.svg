<text x="28" y="798" font-size="12" text-anchor="start" fill="#000">Regla: las dependencias apuntan HACIA el dominio. El dominio no conoce frameworks ni base de datos; los adaptadores implementan los puertos que define la aplicación.</text>
<text x="28" y="813" font-size="12" text-anchor="start" fill="#000">Comunicación: REST/JSON sobre HTTPS (síncrona), WSS para el aforo en vivo (servidor → cliente), y llamadas en proceso entre adaptadores, puertos y núcleo.</text>
<text x="20" y="888" font-size="11.5" fill="#555">Estilo: hexagonal (puertos y adaptadores) · alternativa descartada: capas clásicas acopladas al framework</text>
