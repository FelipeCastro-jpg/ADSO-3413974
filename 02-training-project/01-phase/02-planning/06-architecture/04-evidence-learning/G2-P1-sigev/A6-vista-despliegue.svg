<text x="1335.0" y="96" font-size="11" text-anchor="middle" fill="#000" font-style="italic">«node»</text>
<text x="1335.0" y="114.0" font-size="13.5" text-anchor="middle" fill="#000" font-weight="bold">Proveedor de</text>
<text x="1335.0" y="130.5" font-size="13.5" text-anchor="middle" fill="#000" font-weight="bold">correo y SMS</text>
