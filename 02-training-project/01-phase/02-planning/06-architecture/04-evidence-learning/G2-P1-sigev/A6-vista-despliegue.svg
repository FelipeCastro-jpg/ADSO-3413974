<text x="1220" y="164" font-size="11" text-anchor="start" fill="#000">«artifact» API de envío</text>
<polyline points="300.0,130.0 400.0,130.0" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="350" y="120" font-size="12" text-anchor="middle" fill="#7a2e00" font-style="italic" stroke="#fff" stroke-width="4" paint-order="stroke">HTTPS 443 · WSS 443</text>
<polyline points="160.0,230.0 160.0,330.0" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="205" y="285" font-size="12" text-anchor="middle" fill="#7a2e00" font-style="italic" stroke="#fff" stroke-width="4" paint-order="stroke">HTTPS 443</text>
<polyline points="680.0,130.0 780.0,130.0" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="730" y="120" font-size="12" text-anchor="middle" fill="#7a2e00" font-style="italic" stroke="#fff" stroke-width="4" paint-order="stroke">HTTP 8080 (red privada)</text>
<polyline points="945.0,270.0 945.0,380.0" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="990" y="330" font-size="12" text-anchor="middle" fill="#7a2e00" font-style="italic" stroke="#fff" stroke-width="4" paint-order="stroke">TLS 5432</text>
<polyline points="830.0,270.0 830.0,330.0 540.0,330.0 540.0,380.0" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="690" y="322" font-size="12" text-anchor="middle" fill="#7a2e00" font-style="italic" stroke="#fff" stroke-width="4" paint-order="stroke">TLS 6380</text>
<polyline points="1124.0,120.0 1200.0,120.0" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="1162" y="110" font-size="12" text-anchor="middle" fill="#7a2e00" font-style="italic" stroke="#fff" stroke-width="4" paint-order="stroke">HTTPS 443</text>
<polyline points="1110.0,460.0 1200.0,460.0" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="1155" y="450" font-size="12" text-anchor="middle" fill="#7a2e00" font-style="italic" stroke="#fff" stroke-width="4" paint-order="stroke">copia diaria · HTTPS</text>
<path d="M20,600 L1458,600 L1470,612 L1470,662 L20,662 Z" fill="#fffde7" stroke="#777"/>
<text x="28" y="618" font-size="12" text-anchor="start" fill="#000">Decisiones por RNF: RNF-03 (99,8 %) → réplicas en 2 zonas y PostgreSQL multi-zona con conmutación automática · RNF-04 (&lt; 1,5 s) → el aforo se cuenta en Redis (operación atómica en memoria)</text>
<text x="28" y="633" font-size="12" text-anchor="start" fill="#000">en lugar de un UPDATE en la BD por cada ingreso · RNF-05 (500 peticiones/s) → autoescalado de 2 a 4 réplicas por uso de CPU · RNF-02 → TLS 1.3 en el balanceador y TLS interno a BD y Redis ·</text>
<text x="28" y="648" font-size="12" text-anchor="start" fill="#000">RNF-10 → la PWA se sirve desde la CDN y funciona offline con su cola local.</text>
<text x="20" y="868" font-size="11.5" fill="#555">8 nodos · protocolo y puerto en cada conexión · despliegue en nube gestionada</text>
</svg>