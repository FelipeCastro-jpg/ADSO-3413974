<text x="560" y="283" font-size="13" text-anchor="middle" fill="#000">o salida registrada</text>
<rect x="445.0" y="333.0" width="230" height="54" rx="14" fill="#ffffff" stroke="#000" stroke-width="1.4"/>
<text x="560" y="357" font-size="13" text-anchor="middle" fill="#000">Recalcular porcentaje</text>
<text x="560" y="373" font-size="13" text-anchor="middle" fill="#000">de ocupación</text>
