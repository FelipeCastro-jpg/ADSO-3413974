<text x="38" y="778" font-size="12" text-anchor="start" fill="#000">bifurcación ni unión).</text>
<text x="20" y="988" font-size="11.5" fill="#555">UML 2.5 · guardas entre corchetes que cubren todas las salidas · ciclo hasta que el organizador cierra el panel</text>
