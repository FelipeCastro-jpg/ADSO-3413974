<text x="28" y="848" font-size="12" text-anchor="start" fill="#000">Notación Chen adaptada (atributos dentro de la entidad). (mín, máx) junto a cada entidad = en cuántas instancias de la relación participa;</text>
<text x="28" y="863" font-size="12" text-anchor="start" fill="#000">mín 1 = participación total, mín 0 = parcial. Doble borde = entidad débil PUERTA (RECINTO + nro_puerta) con relación identificadora «tiene».</text>
<text x="28" y="878" font-size="12" text-anchor="start" fill="#000">La N:M CUENTA–ROL se resuelve con la entidad asociativa ASIGNACIÓN, que tiene atributos propios (fecha_asignación, asignado_por, vigente).</text>
<text x="20" y="988" font-size="11.5" fill="#555">10 entidades · 11 relaciones · 1 entidad débil · 1 entidad asociativa</text>
